# Home-PC profile (residential internet, Windows). Overlay on base.yaml:
#   jevbot record --config config/base.yaml --config config/home.yaml ...
# Goal: keep bandwidth well below the line capacity so feed latency stays low.
binance:
  ws:
    compression: true               # permessage-deflate; JSON shrinks several-fold if the server accepts it
    # 24 h soak: /public socket (50 bookTicker + 12 depth) dropped ~80/h with low loop lag and no local
    # load (reports/local/20260927T173519Z) -> bookTicker on its own small sockets, depth separate.
    family_conn_max:
      bookTicker: 15
      depth: 50
recorder:
  # bookTicker off (2026-09-28): 6 h soak 20260928T120050Z, the top-15 bookTicker socket (~2,200 msg/s on one
  # flow) dropped ~140/h and burst at the 13:30 UTC US open (124 drops in 20 min) while depth / market sockets
  # stayed within <= 3/h; CPU 29 %, loop lag <= 13 ms -> the single heavy flow, not the PC. No active hypothesis
  # (slow/pos/reg, Jev shadow) needs tick-level quotes; spread comes from depth top-of-book instead.
  book_ticker: false
  book_ticker_max_symbols: 30       # only used if book_ticker is switched back on
  depth:
    top_n_by_volume: 30             # 20 levels @500ms, sampled every 5 s: best bid/ask for spread (was 10)
