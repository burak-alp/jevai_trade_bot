# Home-PC profile (residential internet, Windows). Overlay on base.yaml:
#   jevbot record --config config/base.yaml --config config/home.yaml ...
# Goal: keep bandwidth well below the line capacity so feed latency stays low.
binance:
  ws:
    compression: true               # permessage-deflate; JSON shrinks several-fold if the server accepts it
recorder:
  book_ticker_max_symbols: 50       # reduce the busy public socket after the top-100 profile stalled
  depth:
    top_n_by_volume: 10
