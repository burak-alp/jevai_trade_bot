# Home-PC profile (residential internet, Windows). Overlay on base.yaml:
#   jevbot record --config config/base.yaml --config config/home.yaml ...
# Goal: keep bandwidth well below the line capacity so feed latency stays low.
binance:
  ws:
    compression: true               # permessage-deflate; JSON shrinks several-fold if the server accepts it
    # 24 h soak: /public socket (50 bookTicker + 12 depth) dropped ~80/h with low loop lag and no local
    # load (reports/local/20260927T173519Z) -> bookTicker on its own small sockets, depth separate.
    family_conn_max:
      bookTicker: 15
      depth: 50
recorder:
  book_ticker_max_symbols: 30       # 100 stalled, 50 dropped ~80/h in the 24 h soak -> 30 (2 x 15 per socket)
  depth:
    top_n_by_volume: 10
