[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jevbot"
version = "0.1.0"
description = "Binance USDⓈ-M futures research stack: market-data recorder, historical downloader, (later) Jev-filtered trading core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13.0",
  "httpx>=0.27",
  "orjson>=3.9",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
fast = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jevbot = "jevbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: uses a local fake exchange (no internet)"]
